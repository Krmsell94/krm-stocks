name: Nightly Stock Screener

on:
  schedule:
    - cron: '30 14 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '0 22 * * *'
  workflow_dispatch:   # يسمح بالتشغيل اليدوي من GitHub

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance firebase-admin pandas numpy

      - name: Run screener
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python screener.py
