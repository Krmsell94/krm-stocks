name: Nightly Stock Screener

on:
  schedule:
    # 1:00 AM Riyadh time = 10:00 PM UTC (AST = UTC+3)
    - cron: '0 22 * * *'
  workflow_dispatch:   # يسمح بالتشغيل اليدوي من GitHub

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance firebase-admin pandas numpy

      - name: Run screener
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python screener.py
