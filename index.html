<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRM Stocks</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f5f7;
  --bg3: #ebebef;
  --text: #1a1a2e;
  --text2: #555577;
  --border: #d0d0e0;
  --card-bg: #ffffff;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --green: #16a34a;
  --red: #dc2626;
  --gold: #ca8a04;
  --blue: #2563eb;
  --sidebar-bg: #f8f8fc;
  --sidebar-border: #e0e0ee;
  --tab-active-bg: #1a1a2e;
  --tab-active-text: #ffffff;
  --tab-hover: #e8e8f4;
  --market-btn-bg: #f0f0f8;
  --market-btn-active: #1a1a2e;
  --market-btn-active-text: #fff;
  --badge-ready: #dcfce7;
  --badge-ready-text: #16a34a;
}
[data-theme="dark"] {
  --bg: #0d0d1a;
  --bg2: #13131f;
  --bg3: #1a1a2e;
  --text: #e8e8ff;
  --text2: #8888aa;
  --border: #2a2a3a;
  --card-bg: #16162a;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.4);
  --green: #22c55e;
  --red: #ef4444;
  --gold: #f59e0b;
  --blue: #60a5fa;
  --sidebar-bg: #111122;
  --sidebar-border: #2a2a3a;
  --tab-active-bg: #5555ff;
  --tab-active-text: #ffffff;
  --tab-hover: #1e1e30;
  --market-btn-bg: #1e1e30;
  --market-btn-active: #5555ff;
  --market-btn-active-text: #fff;
  --badge-ready: #14532d;
  --badge-ready-text: #22c55e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ── Layout ── */
.app-layout {
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: 180px;
  min-width: 180px;
  background: var(--sidebar-bg);
  border-left: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 16px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  padding: 0 14px 14px;
  border-bottom: 1px solid var(--sidebar-border);
}

.sidebar-logo {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Market selector (above tabs) ── */
.market-selector {
  padding: 14px 10px 10px;
  border-bottom: 1px solid var(--sidebar-border);
}
.market-label {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 6px;
  text-align: center;
}
.market-btns {
  display: flex;
  gap: 4px;
}
.market-btn {
  flex: 1;
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--market-btn-bg);
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.market-btn.active {
  background: var(--market-btn-active);
  color: var(--market-btn-active-text);
  border-color: var(--market-btn-active);
  font-weight: 600;
}

/* ── Nav tabs ── */
.sidebar-nav {
  flex: 1;
  padding: 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text2);
  font-size: 14px;
  transition: all 0.2s;
  border: none;
  background: none;
  width: 100%;
  text-align: right;
}
.nav-tab:hover { background: var(--tab-hover); color: var(--text); }
.nav-tab.active {
  background: var(--tab-active-bg);
  color: var(--tab-active-text);
  font-weight: 600;
}
.nav-tab .tab-icon { font-size: 16px; }

/* ── Dark mode toggle ── */
.sidebar-footer {
  padding: 12px 10px;
  border-top: 1px solid var(--sidebar-border);
}
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  background: var(--market-btn-bg);
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 13px;
  width: 100%;
  justify-content: center;
}
.theme-toggle:hover { background: var(--tab-hover); }

/* ── Main content ── */
.main-content {
  flex: 1;
  padding: 20px;
  min-width: 0;
}

.page { display: none; }
.page.active { display: block; }

/* ── Page header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.page-title {
  font-size: 20px;
  font-weight: 700;
}
#lastUpdate {
  font-size: 12px;
  color: var(--text2);
}

/* ── Cards grid ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

/* ── Stock card (tall rectangle) ── */
.stock-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stock-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  border-color: var(--blue);
}
.card-symbol {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.card-price {
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
}
.card-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
.card-detail-label { color: var(--text2); }
.card-detail-val { font-weight: 600; color: var(--text); }
.card-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2px 0;
}
.card-note {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.4;
}
.conf-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.conf-bar {
  flex: 1;
  height: 5px;
  background: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
}
.conf-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.conf-pct { font-size: 12px; font-weight: 700; min-width: 32px; text-align: left; }

.badge-ready {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: var(--badge-ready);
  color: var(--badge-ready-text);
}
.badge-wait {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  background: var(--bg3);
  color: var(--text2);
}

/* ── Arkitaz card specific ── */
.ark-conditions {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ark-condition {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}
.ark-condition .cond-icon { font-size: 12px; }
.ark-condition .cond-label { color: var(--text2); flex: 1; }
.ark-condition .cond-val { font-weight: 600; font-size: 11px; }
.cond-ok { color: var(--green); }
.cond-warn { color: var(--gold); }
.cond-bad { color: var(--red); }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }

/* ── Detail page ── */
#detail-page {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  overflow-y: auto;
  padding: 20px;
}
#detail-page.open { display: block; }

.detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-back {
  padding: 8px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  font-size: 14px;
}
.btn-back:hover { background: var(--tab-hover); }

#detailSymbol { font-size: 24px; font-weight: 700; }

.detail-actions {
  display: flex;
  gap: 8px;
  margin-right: auto;
}
.btn-buy {
  padding: 8px 16px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
.btn-buy.bought { background: var(--bg3); color: var(--text2); cursor: default; }
.btn-tv-link {
  padding: 8px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  text-decoration: none;
  font-size: 13px;
}

.detail-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.stat-value { font-size: 16px; font-weight: 700; }

.tl-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 600; }
.tl-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.tl-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.tl-item-label { font-size: 11px; color: var(--text2); margin-bottom: 3px; }
.tl-item-val { font-size: 16px; font-weight: 700; }
.tl-entry .tl-item-val { color: var(--blue); }
.tl-stop .tl-item-val { color: var(--red); }
.tl-t1 .tl-item-val { color: var(--green); }
.tl-t2 .tl-item-val { color: #a855f7; }

.detail-layers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.layer-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.layer-name { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.layer-val { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.layer-bar { height: 4px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.layer-fill { height: 100%; border-radius: 4px; }

#detailChart {
  height: 280px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}

.buy-form { display: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 10px; }
.buy-form.open { display: block; }
.buy-form label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; margin-top: 10px; }
.buy-form input, .buy-form select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 14px;
}
.btn-save-buy {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
.btn-cancel-buy {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
}
#saveIndicator { font-size: 13px; color: var(--green); margin-top: 8px; }

.news-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.news-item a { color: var(--blue); text-decoration: none; font-size: 13px; }
.news-item a:hover { text-decoration: underline; }
.news-meta { font-size: 11px; color: var(--text2); margin-top: 3px; }
.news-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }

/* ── Close Trade Dialog ── */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.dialog-overlay.open { display: flex; }
.dialog-box {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  width: 320px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.dialog-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

/* ── Performance / Portfolio tables ── */
.perf-section { margin-bottom: 24px; }
.perf-section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.trades-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.trades-table th {
  background: var(--bg2);
  padding: 10px 12px;
  text-align: right;
  color: var(--text2);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}
.trades-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.trades-table tr:last-child td { border-bottom: none; }
.trades-table tr:hover td { background: var(--bg2); }
.pnl-pos { color: var(--green); font-weight: 600; }
.pnl-neg { color: var(--red); font-weight: 600; }
.btn-close-trade {
  padding: 4px 10px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.btn-remove-trade {
  padding: 4px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text2);
  font-size: 12px;
}
.status-open { color: var(--blue); font-weight: 600; }
.status-closed { color: var(--text2); }
.status-profit { color: var(--green); font-weight: 600; }
.status-loss { color: var(--red); font-weight: 600; }

/* ── Portfolio manual add ── */
.btn-add-portfolio {
  padding: 8px 16px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}
.add-portfolio-form {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
.add-portfolio-form.open { display: block; }
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.form-grid label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
.form-grid input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 14px;
}

/* ── News calendar ── */
.news-calendar {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.cal-title { font-size: 15px; font-weight: 700; }
.cal-nav-btn {
  padding: 6px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}
.cal-nav-btn:hover { background: var(--tab-hover); }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day {
  border-right: 1px solid var(--border);
  min-height: 120px;
}
.cal-day:last-child { border-right: none; }
.cal-day-header {
  background: var(--bg2);
  padding: 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
}
.cal-day-header.today { color: var(--blue); }
.cal-events { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.cal-event {
  background: var(--bg2);
  border-right: 3px solid var(--blue);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 10px;
  cursor: pointer;
}
.cal-event:hover { background: var(--tab-hover); }
.cal-event-time { color: var(--text2); font-size: 9px; }
.cal-event-title { color: var(--text); font-weight: 600; line-height: 1.3; }
.cal-event-impact-high { border-color: var(--red); }
.cal-event-impact-med { border-color: var(--gold); }
.cal-event-impact-low { border-color: var(--green); }
.cal-loading { text-align: center; padding: 40px; color: var(--text2); }

/* ── Responsive ── */
@media (max-width: 700px) {
  .sidebar { width: 60px; min-width: 60px; }
  .nav-tab span.tab-label { display: none; }
  .market-btn span { display: none; }
  .sidebar-logo span { display: none; }
  .cal-days { grid-template-columns: 1fr; }
  .detail-stats { grid-template-columns: 1fr 1fr; }
  .detail-layers { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="app-layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">📈 <span>KRM</span></div>
    </div>

    <!-- Market selector -->
    <div class="market-selector">
      <div class="market-label">السوق</div>
      <div class="market-btns">
        <button class="market-btn active" id="btnUS" onclick="setMarket('us', this)">🇺🇸 <span>US</span></button>
        <button class="market-btn" id="btnSA" onclick="setMarket('sa', this)">🇸🇦 <span>SA</span></button>
      </div>
    </div>

    <!-- Nav tabs -->
    <nav class="sidebar-nav">
      <button class="nav-tab active" onclick="switchTab('foras', this)">
        <span class="tab-icon">🚀</span>
        <span class="tab-label">الفرص</span>
      </button>
      <button class="nav-tab" onclick="switchTab('arkitaz', this)">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">الارتكاز</span>
      </button>
      <button class="nav-tab" onclick="switchTab('performance', this)">
        <span class="tab-icon">📊</span>
        <span class="tab-label">الأداء</span>
      </button>
      <button class="nav-tab" onclick="switchTab('portfolio', this)">
        <span class="tab-icon">💼</span>
        <span class="tab-label">محفظتي</span>
      </button>
      <button class="nav-tab" onclick="switchTab('calendar', this)">
        <span class="tab-icon">📅</span>
        <span class="tab-label">الأخبار</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">ليلي</span>
      </button>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main-content">

    <!-- ── FORAS PAGE ── -->
    <div id="page-foras" class="page active">
      <div class="page-header">
        <div class="page-title">🚀 الفرص</div>
        <span id="lastUpdate">جاري التحميل...</span>
      </div>
      <div class="cards-grid" id="grid-foras"></div>
    </div>

    <!-- ── ARKITAZ PAGE ── -->
    <div id="page-arkitaz" class="page">
      <div class="page-header">
        <div class="page-title">🎯 الارتكاز</div>
        <span style="font-size:11px;color:var(--text2)">RSI 23-27 + دعم + MACD</span>
      </div>
      <div class="cards-grid" id="grid-arkitaz"></div>
    </div>

    <!-- ── PERFORMANCE PAGE ── -->
    <div id="page-performance" class="page">
      <div class="page-header">
        <div class="page-title">📊 الأداء</div>
      </div>
      <div class="perf-section">
        <div class="perf-section-title">⚡ صفقات تلقائية (الفرص والارتكاز)</div>
        <div id="perf-summary" style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;"></div>
        <table class="trades-table">
          <thead>
            <tr>
              <th>السهم</th><th>الدخول</th><th>التاريخ</th>
              <th>الهدف1</th><th>الهدف2</th><th>الوقف</th>
              <th>الحالة</th><th>ربح/خسارة</th><th></th>
            </tr>
          </thead>
          <tbody id="perf-tbody"></tbody>
        </table>
      </div>
    </div>

<!-- ══ Main Script ══ -->
<script type="module">

// ── Globals ──
let _currentStock = null;
let _trades = [];
let _portfolioTrades = [];
let _closeTradeId = null;
let _currentMarket = 'us';
let _calWeekOffset = 0;

// ── Wait helpers ──
async function waitForDB() {
  for (let i = 0; i < 50; i++) {
    if (window._db) return;
    await new Promise(r => setTimeout(r, 100));
  }
  throw new Error('Firebase timeout');
}
async function waitForUID() {
  for (let i = 0; i < 100; i++) {
    if (window._uid) return window._uid;
    await new Promise(r => setTimeout(r, 100));
  }
  throw new Error('Auth timeout');
}

// ── Theme ──
window.toggleTheme = function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeIcon').textContent = '🌙';
    document.getElementById('themeLabel').textContent = 'ليمي';
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'نهاري';
    localStorage.setItem('theme', 'dark');
  }
};
(function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'نهاري';
  }
})();

// ── Market switch ──
window.setMarket = function(market, el) {
  _currentMarket = market;
  document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  reloadCurrentTab();
};

function reloadCurrentTab() {
  const activeTab = document.querySelector('.nav-tab.active');
  if (!activeTab) return;
  const fn = activeTab.getAttribute('onclick');
  if (fn && fn.includes('foras')) loadForas();
  else if (fn && fn.includes('arkitaz')) loadArkitaz();
  else if (fn && fn.includes('performance')) loadPerformance();
  else if (fn && fn.includes('portfolio')) loadPortfolio();
}

// ── Tab switch ──
window.switchTab = function(tab, el) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'foras') loadForas();
  else if (tab === 'arkitaz') loadArkitaz();
  else if (tab === 'performance') loadPerformance();
  else if (tab === 'portfolio') loadPortfolio();
  else if (tab === 'calendar') loadCalendar();
};

// ── Helpers ──
function confColor(v) {
  if (v >= 70) return 'var(--green)';
  if (v >= 40) return 'var(--gold)';
  return 'var(--red)';
}
function rsiColor(v) {
  if (!v) return 'var(--text2)';
  if (v >= 23 && v <= 27) return 'var(--green)';
  if (v < 23 || (v > 27 && v <= 35)) return 'var(--gold)';
  return 'var(--red)';
}

// ── Chart ──
function renderFullChart(container, candles) {
  container.innerHTML = '';
  if (!candles || !candles.length) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;flex-direction:column;gap:8px"><div>📊</div><div style="font-size:12px">بيانات الشارت ستُضاف تلقائياً</div></div>';
    return;
  }
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth || 700,
    height: 268,
    layout: { background: { color: 'transparent' }, textColor: isDark ? '#8888aa' : '#555577' },
    grid: { vertLines: { color: isDark ? '#2a2a3a' : '#e0e0ee' }, horzLines: { color: isDark ? '#2a2a3a' : '#e0e0ee' } },
    rightPriceScale: { borderColor: isDark ? '#2a2a3a' : '#e0e0ee' },
    timeScale: { borderColor: isDark ? '#2a2a3a' : '#e0e0ee', timeVisible: true },
  });
  const series = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
  });
  series.setData(candles.map(c => ({ time: c.t, open: c.o, high: c.h, low: c.l, close: c.c })));
  chart.timeScale().fitContent();
}

// ── Build FORAS card (tall rectangle with key levels) ──
function buildForasCard(symbol, data, market) {
  const div = document.createElement('div');
  div.className = 'stock-card';
  const conf = data.confidence || 0;
  const confCol = confColor(conf);
  const isReady = conf >= 60;

  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="card-symbol">${symbol}</div>
      <span class="${isReady ? 'badge-ready' : 'badge-wait'}">${isReady ? '✅ جاهز' : '⏳ انتظار'}</span>
    </div>
    <div class="card-price">$${data.close ? data.close.toFixed(2) : '—'}</div>
    <hr class="card-divider">
    <div class="ark-conditions">
      <div class="card-detail-row">
        <span class="card-detail-label">🎯 دخول</span>
        <span class="card-detail-val" style="color:var(--blue)">${data.entry ? '$'+data.entry : '—'}</span>
      </div>
      <div class="card-detail-row">
        <span class="card-detail-label">🛑 وقف</span>
        <span class="card-detail-val" style="color:var(--red)">${data.stop_loss ? '$'+data.stop_loss : '—'}</span>
      </div>
      <div class="card-detail-row">
        <span class="card-detail-label">🟢 هدف 1</span>
        <span class="card-detail-val" style="color:var(--green)">${data.target1 ? '$'+data.target1 : '—'}</span>
      </div>
      <div class="card-detail-row">
        <span class="card-detail-label">🚀 هدف 2</span>
        <span class="card-detail-val" style="color:#a855f7">${data.target2 ? '$'+data.target2 : '—'}</span>
      </div>
    </div>
    <hr class="card-divider">
    <div class="conf-row">
      <div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${confCol}"></div></div>
      <span class="conf-pct" style="color:${confCol}">${conf}%</span>
    </div>
    <div class="card-note">${data.note || ''}</div>
  `;
  div.onclick = () => openDetail(symbol, data, market);
  autoRegisterPaperTrade(symbol, data);
  return div;
}

// ── Build ARKITAZ card (tall rectangle with conditions) ──
function buildArkitazCard(symbol, data, market) {
  const div = document.createElement('div');
  div.className = 'stock-card';
  const conf = data.confidence || 0;
  const confCol = confColor(conf);

  const rsi = data.rsi;
  const rsiOk = rsi && rsi >= 23 && rsi <= 27;
  const macdOk = data.macd_improving;
  const maOk = data.ma_recovering;
  const supportOk = data.has_support;
  const candleOk = data.bullish_candle;

  const rsiLabel = rsi ? rsi.toFixed(1) : '—';
  const rsiCol = rsiColor(rsi);

  const checkIcon = (ok) => ok ? '✅' : (ok === false ? '❌' : '⚪');

  const isReady = conf >= 50 || (rsiOk && supportOk);

  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="card-symbol">${symbol}</div>
      <span class="${isReady ? 'badge-ready' : 'badge-wait'}">${isReady ? '🎯 جاهز' : '⏳ انتظار'}</span>
    </div>
    <div class="card-price">$${data.close ? data.close.toFixed(2) : '—'}</div>
    <hr class="card-divider">
    <div class="ark-conditions">
      <div class="ark-condition">
        <span class="cond-icon">${checkIcon(rsiOk)}</span>
        <span class="cond-label">RSI</span>
        <span class="cond-val" style="color:${rsiCol}">${rsiLabel}</span>
      </div>
      <div class="ark-condition">
        <span class="cond-icon">${checkIcon(macdOk)}</span>
        <span class="cond-label">MACD</span>
        <span class="cond-val ${macdOk ? 'cond-ok' : 'cond-warn'}">${macdOk ? 'يتحسن' : 'ضعيف'}</span>
      </div>
      <div class="ark-condition">
        <span class="cond-icon">${checkIcon(maOk)}</span>
        <span class="cond-label">المتوسطات</span>
        <span class="cond-val ${maOk ? 'cond-ok' : 'cond-warn'}">${maOk ? 'يستعيد' : 'تحتها'}</span>
      </div>
      <div class="ark-condition">
        <span class="cond-icon">${checkIcon(supportOk)}</span>
        <span class="cond-label">دعم واظح</span>
        <span class="cond-val">${data.support_level ? '$'+data.support_level : (supportOk ? 'نعم' : '—')}</span>
      </div>
      <div class="ark-condition">
        <span class="cond-icon">${checkIcon(candleOk)}</span>
        <span class="cond-label">شمعة إيجابية</span>
        <span class="cond-val ${candleOk ? 'cond-ok' : ''}">${candleOk ? 'نصم' : '—'}</span>
      </div>
    </div>
    <hr class="card-divider">
    <div class="conf-row">
      <div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${confCol}"></div></div>
      <span class="conf-pct" style="color:${confCol}">${conf}%</span>
    </div>
    <div class="card-note">${data.consReason || data.note || ''}</div>
  `;
  div.onclick = () => openDetail(symbol, data, market);
  return div;
}

// ── Load FORAS ──
async function loadForas() {
  const grid = document.getElementById('grid-foras');
  grid.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>جاري التحميل...</div>';
  try {
    await waitForDB();
    const { getDocs, collection } = window._firestoreOps;
    const collName = _currentMarket === 'sa' ? 'suggestions_sa' : 'suggestions_us';
    const snap = await getDocs(collection(window._db, collName));
    grid.innerHTML = '';
    if (snap.empty) { grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>لا توجد فرص</div>'; return; }
    snap.forEach(d => {
      const data = d.data();
      if (data.confidence >= 40 || data.entry) {
        grid.appendChild(buildForasCard(d.id, data, _currentMarket));
      }
    });
    loadMeta();
  } catch(err) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>خطأ: ${err.message}</div>`;
  }
}

// ── Load ARKITAZ ──
async function loadArkitaz() {
  const grid = document.getElementById('grid-arkitaz');
  grid.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>جاري اقتحميل...</div>';
  try {
    await waitForDB();
    const { getDocs, collection } = window._firestoreOps;
    const collName = _currentMarket === 'sa' ? 'consolidation_sa' : 'consolidation_us';
    const snap = await getDocs(collection(window._db, collName));
    grid.innerHTML = '';
    if (snap.empty) { grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>لا توجد أسهم ارتكاز</div>'; return; }
    snap.forEach(d => {
      grid.appendChild(buildArkitazCard(d.id, d.data(), _currentMarket));
    });
  } catch(err) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>خطأ: ${err.message}</div>`;
  }
}

// ── Load meta ──
async function loadMeta() {
  try {
    await waitForDB();
    const { doc, getDoc } = window._firestoreOps;
    const collName = _currentMarket === 'sa' ? 'suggestions_sa' : 'suggestions_us';
    const metaDoc = await getDoc(doc(window._db, 'meta', collName));
    const d = metaDoc.data();
    document.getElementById('lastUpdate').textContent = d?.lastRun ? 'آخر تحديث: ' + d.lastRun : '';
  } catch {}
}

// ── Auto-register paper trade (for performance tab) ──
function autoRegisterPaperTrade(sym, data) {
  if (!data.confidence || data.confidence < 60) return;
  const trades = JSON.parse(localStorage.getItem('paperTrades') || '{}');
  if (trades[sym]) return;
  trades[sym] = {
    id: sym + '_' + Date.now(),
    sym, symbol: sym,
    entry: data.entry || data.close,
    stop_loss: data.stop_loss,
    target1: data.target1,
    target2: data.target2,
    strategy: data.strategy_type || 'auto',
    confidence: data.confidence,
    registeredAt: new Date().toISOString(),
    status: 'open',
    source: 'auto'
  };
  localStorage.setItem('paperTrades', JSON.stringify(trades));
}

// ── Load Performance (auto trades) ──
async function loadPerformance() {
  const tbody = document.getElementById('perf-tbody');
  tbody.innerHTML = '';
  try {
    await waitForDB();
    const uid = await waitForUID();
    const { getDocs, collection } = window._firestoreOps;
    const snap = await getDocs(collection(window._db, 'users', uid, 'trades'));
    _trades = [];
    snap.forEach(d => _trades.push({...d.data(), id: d.id}));
    // Also local auto trades
    const localTrades = Object.values(JSON.parse(localStorage.getItem('paperTrades') || '{}'));
    const allAutoTrades = [..._trades.filter(t => t.source === 'auto' || !t.source), ...localTrades.filter(lt => !_trades.find(t => t.id === lt.id))];
    renderPerfTable(allAutoTrades, tbody);
    renderPerfSummary(allAutoTrades);
  } catch(err) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--text2)">خطأ في التحميل</td></tr>`;
  }
}

function renderPerfTable(trades, tbody) {
  tbody.innerHTML = '';
  if (!trades.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text2)">لا توجد صفقات تلقائية بعد</td></tr>';
    return;
  }
  trades.forEach(t => {
    const pnl = t.close_price && t.entry ? ((t.close_price - t.entry) / t.entry * 100).toFixed(2) : null;
    const pnlClass = pnl > 0 ? 'pnl-pos' : pnl < 0 ? 'pnl-neg' : '';
    const statusLabel = t.status === 'open' ? '<span class="status-open">مفتوحة</span>' :
      (pnl > 0 ? '<span class="status-profit">ربح</span>' : '<span class="status-loss">خسارة</span>');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${t.sym || t.symbol}</strong></td>
      <td>${t.entry ? '$'+Number(t.entry).toFixed(2) : '—'}</td>
      <td style="font-size:11px">${t.registeredAt ? t.registeredAt.split('T')[0] : '—'}</td>
      <td>${t.target1 ? '$'+Number(t.target1).toFixed(2) : '—'}</td>
      <td>${t.target2 ? '$'+Number(t.target2).toFixed(2) : '—'}</td>
      <td>${t.stop_loss ? '$'+Number(t.stop_loss).toFixed(2) : '—'}</td>
      <td>${statusLabel}</td>
      <td class="${pnlClass}">${pnl !== null ? pnl+'%' : '—'}</td>
      <td>
        ${t.status === 'open' ? `<button class="btn-close-trade" onclick="openCloseTrade('${t.id || t.sym}')">إغلاق</button>` : ''}
        <button class="btn-remove-trade" onclick="removeTrade('${t.id || t.sym}')" style="margin-top:2px">حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function renderPerfSummary(trades) {
  const el = document.getElementById('perf-summary');
  const total = trades.length;
  const closed = trades.filter(t => t.status !== 'open');
  const wins = closed.filter(t => t.close_price && t.entry && t.close_price > t.entry);
  el.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center">
      <div style="font-size:11px;color:var(--text2)">إجمالي</div>
      <div style="font-size:20px;font-weight:700">${total}</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center">
      <div style="font-size:11px;color:var(--text2)">مفتوحة</div>
      <div style="font-size:20px;font-weight:700;color:var(--blue)">${trades.filter(t => t.status === 'open').length}</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center">

window.savePortfolioTrade = async function() {

async function loadPortfolio() {
  const tbody = document.getElementById('portfolio-tbody');
  tbody.innerHTML = '';
  try {
    await waitForDB();
    const uid = await waitForUID();
    const { getDocs, collection } = window._firestoreOps;
    const snap = await getDocs(collection(window._db, 'users', uid, 'portfolio'));
    _portfolioTrades = [];
    snap.forEach(d => _portfolioTrades.push({...d.data(), id: d.id}));
    if (!_portfolioTrades.length) {

    _portfolioTrades.forEach(t => {
      const statusLabel = t.status === 'open' ? '<span class="status-open">مفتوحة</span>' : '<span class="status-closed">مغلقة</span>';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${t.symbol || t.sym}</strong></td>
        <td>$${Number(t.entry).toFixed(2)}</td>
        <td>${t.qty || '—'}</td>
        <td>${t.target1 ? '$'+Number(t.target1).toFixed(2) : '—'}</td>
        <td>${t.stop_loss ? '$'+Number(t.stop_loss).toFixed(2) : '—'}</td>

window.removePortfolioTrade = async function(id) {
  if (!confirm('حذف هذه الصفقة؟')) return;
  try {

    const uid = await waitForUID();

    await deleteDoc(doc(window._db, 'users', uid, 'portfolio', id));

};

// ── News Calendar ──
const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function getWeekStart(offset = 0) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const sun = new Date(now);
  sun.setDate(now.getDate() - day + (offset * 7));
  sun.setHours(0,0,0,0);
  return sun;
}

async function loadCalendar() {
  const grid = document.getElementById('calDaysGrid');
  const weekStart = getWeekStart(_calWeekOffset);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 7);

  const fmt = (d) => d.toLocaleDateString('ar-SA', {month:'short',day:'numeric'});
  document.getElementById('calWeekLabel').textContent = `${fmt(weekStart)} — ${fmt(new Date(weekEnd.getTime()-86400000))}`;

  grid.innerHTML = '<div class="cal-loading">⏳ جاري تحميل الأخبار...</div>';

  try {
    // Fetch economic calendar from a CORS-friendly source
    const startStr = weekStart.toISOString().split('T')[0];
    const endStr = new Date(weekEnd.getTime()-86400000).toISOString().split('T')[0];

    // Use Investing.com/Forexfactory via a proxy or build static data
    // For now we build the grid and show placeholder; real data needs backend
    grid.innerHTML = '';

    const today = new Date();
    today.setHours(0,0,0,0);

    for (let i = 0; i < 7; i++) {
      const day = new Date(weekStart);
      day.setDate(weekStart.getDate() + i);
      const isToday = day.getTime() === today.getTime();
      const dayEl = document.createElement('div');
      dayEl.className = 'cal-day';
      dayEl.innerHTML = `
        <div class="cal-day-header ${isToday ? 'today' : ''}">
          ${DAY_NAMES[day.getDay()]}
          <br><span style="font-size:10px">${day.getDate()}/${day.getMonth()+1}</span>
        </div>
        <div class="cal-events" id="cal-events-${i}">
          <div style="font-size:10px;color:var(--text2);text-align:center;padding:8px">—</div>
        </div>
      `;
      grid.appendChild(dayEl);
    }

    // Try to load from Firestore 'news_calendar' if available
    await loadCalendarFromFirestore(weekStart);

  } catch(err) {
    grid.innerHTML = `<div class="cal-loading">⚠️ خطأ: ${err.message}</div>`;
  }
}

async function loadCalendarFromFirestore(weekStart) {
  try {
    await waitForDB();
    const { getDocs, collection, query, where } = window._firestoreOps;
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 7);

    const startStr = weekStart.toISOString().split('T')[0];
    const endStr = weekEnd.toISOString().split('T')[0];

    const snap = await getDocs(query(
      collection(window._db, 'economic_calendar'),
      where('date', '>=', startStr),
      where('date', '<', endStr)
    ));

    if (snap.empty) return;

    snap.forEach(d => {
      const ev = d.data();
      const evDate = new Date(ev.date);
      const dayIdx = Math.floor((evDate - weekStart) / 86400000);
      if (dayIdx < 0 || dayIdx > 6) return;
      const evContainer = document.getElementById('cal-events-' + dayIdx);
      if (!evContainer) return;
      // Clear placeholder
      if (evContainer.querySelector('[style*="—"]')) evContainer.innerHTML = '';
      const impactClass = ev.impact === 'high' ? 'cal-event-impact-high' : ev.impact === 'medium' ? 'cal-event-impact-med' : 'cal-event-impact-low';
      const evEl = document.createElement('div');
      evEl.className = `cal-event ${impactClass}`;
      evEl.innerHTML = `
        <div class="cal-event-time">${ev.time || ''} ${ev.country || ''}</div>
        <div class="cal-event-title">${ev.event || ev.title || ''}</div>
      `;
      evContainer.appendChild(evEl);
    });
  } catch {}
}

window.calNextWeek = function() { _calWeekOffset++; loadCalendar(); };
window.calPrevWeek = function() { _calWeekOffset--; loadCalendar(); };

// ── Save buy ──
window.saveBuyDetail = async function() {
  if (!_currentStock) return;
  const { symbol, data, market } = _currentStock;
  const price = parseFloat(document.getElementById('buyPriceD').value);
  const qty = parseInt(document.getElementById('buyQtyD').value) || 0;
  const date = document.getElementById('buyDateD').value;
  if (!price) { alert('يرجى إدخال سعر الشراء'); return; }
  const trade = {
    id: symbol + '_' + Date.now(),
    symbol, sym: symbol, market,
    entry: price, qty, date,
    stop_loss: data.stop_loss,
    target1: data.target1,
    target2: data.target2,
    confidence: data.confidence,
    strategy: data.strategy_type || 'manual',
    registeredAt: new Date().toISOString(),
    status: 'open',
    source: 'auto'
  };
  try {
    await waitForDB();
    const uid = await waitForUID();
    const { doc, setDoc } = window._firestoreOps;
    await setDoc(doc(window._db, 'users', uid, 'trades', trade.id), trade);
    _trades.push(trade);
    document.getElementById('saveIndicator').textContent = '✅ تم الحفظ';
    document.getElementById('buyFormDetail').classList.remove('open');
    document.getElementById('btnBuyDetail').textContent = '✅ تم الشراء';

  } catch(err) {
    document.getElementById('saveIndicator').textContent = '❌ ' + err.message;
  }
};

    await waitForDB();
    const uid = await waitForUID();
